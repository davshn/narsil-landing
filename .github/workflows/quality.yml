name: Quality

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**', '.atl/**']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect code changes
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          if grep -Eqv '(^[^/]+\.md$|^docs/)' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.changes.result == 'success' && needs.changes.outputs.code == 'true' && contains(github.event.pull_request.labels.*.name, 'ready-for-review'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:check

      - name: Secretlint
        run: pnpm secretlint

      - name: Unit tests with coverage
        run: pnpm test:cov

      - name: Build
        run: pnpm build

      - name: Lighthouse CI
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 7

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm e2e --project=chromium

      - name: Upload E2E results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: e2e/results/
          retention-days: 7

      - name: Dependency audit
        run: pnpm audit:check

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: SonarCloud analysis
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  gate:
    name: Merge gate
    needs: [changes, quality]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Evaluate merge gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Change detection did not succeed (changes=${CHANGES_RESULT})."
            exit 1
          fi
          if [ "$CODE_CHANGED" != "true" ]; then
            echo "Documentation-only pull request; quality checks are not required."
            exit 0
          fi
          labels="$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')"
          if ! grep -qx 'ready-for-review' <<< "$labels"; then
            echo "::error::Add the 'ready-for-review' label to run the quality checks."
            exit 1
          fi
          if [ "$QUALITY_RESULT" = "success" ]; then
            echo "All required jobs succeeded."
            exit 0
          fi
          if [ "$QUALITY_RESULT" = "failure" ]; then
            gh api -X DELETE "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/ready-for-review" --silent \
              || echo "::warning::Could not remove the 'ready-for-review' label."
          fi
          echo "::error::Required jobs did not succeed (quality=${QUALITY_RESULT})."
          exit 1
